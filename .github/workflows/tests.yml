name: Tests

on:
  schedule:
    - cron: "0 3 * * *" # nightly full regression, 03:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, smoke]
        default: regression
      browsers:
        description: Browsers
        type: choice
        options: [all, chrome, firefox, edge]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan run
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_BROWSERS: ${{ inputs.browsers }}
        run: |
          # Nightly runs cover every browser; manual runs use the chosen inputs.
          case "$EVENT" in
            schedule) suite=regression; browsers=all ;;
            *)        suite="$INPUT_SUITE"; browsers="$INPUT_BROWSERS" ;;
          esac
          if [ "$browsers" = all ]; then
            json='["chrome","firefox","edge"]'
          else
            json="[\"$browsers\"]"
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "browsers=$json" >> "$GITHUB_OUTPUT"
          echo "Running **$suite** on $json" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ needs.plan.outputs.suite }} on ${{ matrix.browser }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    env:
      BROWSER_HEADLESS: "true"
      SUITE: ${{ needs.plan.outputs.suite }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests
        run: |
          profile=""
          if [ "$SUITE" = smoke ]; then profile="-Psmoke"; fi
          mvn -B -ntp clean test $profile -Dbrowser="$BROWSER"

      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          files=(target/surefire-reports/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No test results found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          attr() { grep -ho "$1=\"[0-9]*\"" "${files[@]}" | head -1 | grep -o '[0-9]*'; }
          tests=$(attr tests); failures=$(attr failures); errors=$(attr errors); skipped=$(attr skipped)
          {
            echo "### $SUITE on $BROWSER"
            echo "| Run | Passed | Failed | Errors |"
            echo "|---|---|---|---|"
            echo "| $((tests - skipped)) | $((tests - skipped - failures - errors)) | $failures | $errors |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Allure report
        if: always()
        run: mvn -B -ntp allure:report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/site/allure-maven-plugin
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: target/selenide-reports
          if-no-files-found: ignore
          retention-days: 14

  publish-report:
    name: Publish report
    needs: [plan, test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-report-*
          path: downloaded

      - name: Assemble site
        env:
          SUITE: ${{ needs.plan.outputs.suite }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p site
          links=""
          for dir in downloaded/allure-report-*; do
            [ -d "$dir" ] || continue
            browser="${dir#downloaded/allure-report-}"
            mv "$dir" "site/$browser"
            links="$links<li><a href=\"$browser/\">$browser</a></li>"
          done
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Test Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #1f2328; background: #fff; }
              a { color: #0969da; } li { margin: .4rem 0; font-size: 1.1rem; }
              .meta { color: #59636e; }
            </style>
          </head>
          <body>
            <h1>Allure test reports</h1>
            <p class="meta">Suite: <strong>$SUITE</strong> &middot; commit <code>${SHA:0:7}</code> &middot; <a href="$RUN_URL">workflow run</a> &middot; $(date -u '+%Y-%m-%d %H:%M UTC')</p>
            <ul>$links</ul>
          </body>
          </html>
          EOF

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
