name: Tests

on:
  schedule:
    - cron: "0 3 * * *" # nightly full regression, 03:00 UTC
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options: [regression, smoke]
        default: regression
      browsers:
        description: Browsers
        type: choice
        options: [all, chrome, firefox, edge]
        default: all

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan run
    runs-on: ubuntu-24.04
    outputs:
      suite: ${{ steps.plan.outputs.suite }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_BROWSERS: ${{ inputs.browsers }}
        run: |
          # Nightly runs cover every browser; manual runs use the chosen inputs.
          case "$EVENT" in
            schedule) suite=regression; browsers=all ;;
            *)        suite="$INPUT_SUITE"; browsers="$INPUT_BROWSERS" ;;
          esac
          if [ "$browsers" = all ]; then
            json='["chrome","firefox","edge"]'
          else
            json="[\"$browsers\"]"
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "browsers=$json" >> "$GITHUB_OUTPUT"
          echo "Running **$suite** on $json" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ${{ needs.plan.outputs.suite }} on ${{ matrix.browser }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    env:
      BROWSER_HEADLESS: "true"
      SUITE: ${{ needs.plan.outputs.suite }}
      BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The public site blocks CI browsers with a Cloudflare check, so test a local copy instead.
      - name: Start the Toolshop
        id: toolshop
        uses: IvanKyuchukov98/toolshop-environment@v1

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs unless the
      # browser has an AppArmor profile; Edge has none on the runner and exits at startup.
      - name: Allow the Edge sandbox
        if: matrix.browser == 'edge'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        env:
          UI_BASE_URL: ${{ steps.toolshop.outputs.ui-url }}
          API_BASE_URL: ${{ steps.toolshop.outputs.api-url }}
        run: |
          profiles="-Pparallel" # scenarios run in parallel, each with its own browser
          if [ "$SUITE" = smoke ]; then profiles="$profiles,smoke"; fi
          mvn -B -ntp clean test "$profiles" -Dbrowser="$BROWSER"

      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          files=(target/surefire-reports/TEST-*.xml)
          tests=0; failures=0; errors=0; skipped=0
          if [ ${#files[@]} -gt 0 ]; then
            attr() { grep -ho "$1=\"[0-9]*\"" "${files[@]}" | head -1 | grep -o '[0-9]*'; }
            tests=$(attr tests); failures=$(attr failures); errors=$(attr errors); skipped=$(attr skipped)
          fi
          ran=$((tests - skipped)); failed=$((failures + errors))
          {
            echo "### $SUITE on $BROWSER"
            echo "| Run | Passed | Failed |"
            echo "|---|---|---|"
            echo "| $ran | $((ran - failed)) | $failed |"
          } >> "$GITHUB_STEP_SUMMARY"
          # Kept for the report history page.
          echo "RAN=$ran" >> "$GITHUB_ENV"
          echo "FAILED=$failed" >> "$GITHUB_ENV"

      - name: Build reports
        if: always()
        env:
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          mvn -B -ntp net.masterthought:maven-cucumber-reporting:generate allure:report -Pparallel \
            -Dreport.browser="$BROWSER" -Dreport.suite="$SUITE" \
            -Dreport.environment="Toolshop 2.5 (Docker)" -Dreport.build="$RUN_NUMBER"

          # Per browser: the Cucumber report is the main page, Allure sits under allure/.
          # Nesting under the browser name lets all artifacts merge into one site.
          out="report/$BROWSER"
          mkdir -p "$out/allure"
          cp -r target/cucumber-html-reports/. "$out/"
          cp -r target/site/allure-maven-plugin/. "$out/allure/"
          echo '<meta http-equiv="refresh" content="0; url=overview-features.html">' > "$out/index.html"

          # Run details for the report history page (.github/scripts/build-report-index.sh).
          {
            printf 'RUN_NUMBER=%q\n' "$RUN_NUMBER"
            printf 'RUN_ID=%q\n' "$RUN_ID"
            printf 'SUITE=%q\n' "$SUITE"
            printf 'SHA=%q\n' "$SHA"
            printf 'DATE=%q\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf 'RAN=%q\n' "${RAN:-0}"
            printf 'FAILED=%q\n' "${FAILED:-0}"
          } > "$out/run.env"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.browser }}
          path: report
          if-no-files-found: ignore
          retention-days: 30 # the report history page republishes the last 10 runs from these

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: target/selenide-reports
          if-no-files-found: ignore
          retention-days: 14

  publish-report:
    name: Publish report
    needs: [plan, test]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read # download report artifacts of earlier runs
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download this run's reports
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          merge-multiple: true
          path: site/runs/${{ github.run_number }}

      - name: Download earlier runs' reports
        run: bash .github/scripts/fetch-previous-reports.sh site/runs 10

      - name: Build the report history page
        run: bash .github/scripts/build-report-index.sh site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Link the reports in the run summary
        env:
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "### Test reports"
            for dir in "site/runs/$RUN_NUMBER"/*/; do
              [ -d "$dir" ] || continue
              browser="$(basename "$dir")"
              base="${PAGE_URL}runs/$RUN_NUMBER/$browser/"
              echo "- **$browser:** [Cucumber report]($base) · [Allure details](${base}allure/)"
            done
            echo "- [Report history (last 10 runs)](${PAGE_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
