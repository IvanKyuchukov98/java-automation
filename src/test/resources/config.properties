# Default settings. Any key can be overridden with -Dkey=value
# or an environment variable (dots -> underscores, upper case, e.g. UI_BASE_URL).

ui.base.url=https://practicesoftwaretesting.com
api.base.url=https://api.practicesoftwaretesting.com

browser=chrome
browser.headless=false
browser.size=1920x1080
# eager: navigation returns once the HTML is parsed, without waiting for images, fonts and
# third-party scripts. Selenide waits for each element anyway. Use "normal" to wait for everything.
browser.page.load.strategy=eager
timeout.ms=10000

# Public demo account published by the site for testing.
customer.email=customer@practicesoftwaretesting.com
customer.password=welcome01
customer.name=Jane Doe
